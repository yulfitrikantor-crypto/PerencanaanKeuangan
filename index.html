<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perencanaan Keuangan Inspektorat Tahun 2026</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 24px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

        header h1 {
            font-size: 2rem;
            color: #000;
            line-height: 1.35;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .menu-card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0;
        }

        .menu-card:hover {
            background-color: #007bff;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Selamat datang di Perencanaan Keuangan Inspektorat Tahun 2026</h1>
    </header>

    <div class="menu-grid">
        <a class="menu-card" href="https://drive.google.com/drive/folders/1E-53v7HN5LR7wPZjlYLOYweVE_4lpOxU?usp=drive_link" target="_blank">Keuangan</a>
        <a class="menu-card" href="https://drive.google.com/drive/folders/1uhIYWfNLLapwB-q_TeHQTqWezvvp7CQw?usp=drive_link" target="_blank">Perencanaan</a>
        <a class="menu-card" href="https://drive.google.com/drive/folders/1wGDJb6OHh6WX1RBPfvsI_I6VMQaEirqh?usp=sharing" target="_blank">SK</a>
    </div>
</div>

</body>
</html>
